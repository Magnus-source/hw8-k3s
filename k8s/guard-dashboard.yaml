# guard-dashboard.yaml - statisk dashboard över guardens regler och senaste
# testkörning. nginx:alpine serverar en index.html som ligger i ConfigMap:en
# guard-dashboard-html (skapas av k8s/deploy-dashboard.sh från app/index.html).
# Exponeras via k3s inbyggda Traefik på hostnamnet guard.local.
---
apiVersion: v1
kind: Namespace
metadata:
  name: guard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guard-dashboard
  namespace: guard
  labels:
    app: guard-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guard-dashboard
  template:
    metadata:
      labels:
        app: guard-dashboard
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
      volumes:
        - name: html
          configMap:
            name: guard-dashboard-html
---
apiVersion: v1
kind: Service
metadata:
  name: guard-dashboard
  namespace: guard
spec:
  selector:
    app: guard-dashboard
  ports:
    - port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guard-dashboard
  namespace: guard
spec:
  ingressClassName: traefik
  rules:
    - host: guard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guard-dashboard
                port:
                  number: 80
